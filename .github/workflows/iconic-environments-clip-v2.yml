name: Iconic Environments Harvest 300 CLIP V2

on:
  push:
    branches:
      - environment-harvest-clip
    paths:
      - ".github/workflows/iconic-environments-clip-v2.yml"
  workflow_dispatch:

concurrency:
  group: iconic-environments-clip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  announce:
    name: Publish CLIP V2 run pointer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: environment-harvest-clip
      - name: Record active CLIP V2 run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          cat > environment-harvest-clip-status.json <<EOF
          {
            "status": "running",
            "workflow": "Iconic Environments Harvest 300 CLIP V2",
            "run_id": "${RUN_ID}",
            "run_number": "${RUN_NUMBER}",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}",
            "artifact_name": "iconic-environments-300-clip"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environment-harvest-clip-status.json
          git commit -m "Record active CLIP V2 harvest ${RUN_ID}" || true
          git push origin HEAD:environment-harvest-clip

  harvest:
    name: CLIP V2 environments ${{ matrix.start }}-${{ matrix.end }}
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { batch: "01", start: 1, end: 30 }
          - { batch: "02", start: 31, end: 60 }
          - { batch: "03", start: 61, end: 90 }
          - { batch: "04", start: 91, end: 120 }
          - { batch: "05", start: 121, end: 150 }
          - { batch: "06", start: 151, end: 180 }
          - { batch: "07", start: 181, end: 210 }
          - { batch: "08", start: 211, end: 240 }
          - { batch: "09", start: 241, end: 270 }
          - { batch: "10", start: 271, end: 300 }
    defaults:
      run:
        working-directory: environment-harvest

    steps:
      - name: Check out CLIP execution branch
        uses: actions/checkout@v4
        with:
          ref: environment-harvest-clip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment-harvest/requirements.txt

      - name: Cache CLIP model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: clip-vit-b32-${{ runner.os }}-${{ hashFiles('environment-harvest/requirements.txt') }}

      - name: Install CPU Torch and harvest dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Assemble CLIP after the complete base engine
        run: |
          python - <<'PY'
          from pathlib import Path
          base_parts = ["00", "01", "02", "03", "04"]
          base = "".join(
              Path(f"parts/harvest_{name}.py.part").read_text(encoding="utf-8")
              for name in base_parts
          )
          marker = 'if __name__ == "__main__":\n    main()'
          head, separator, tail = base.rpartition(marker)
          assert separator, "main invocation marker not found in base engine"
          assert not tail.strip(), "unexpected content after base main invocation"
          clip = Path("parts/harvest_03a_clip.py.part").read_text(encoding="utf-8")
          assembled = head.rstrip() + "\n\n" + clip.strip() + "\n\n" + marker + "\n"
          Path("harvest.py").write_text(assembled, encoding="utf-8")
          PY
          python -m py_compile harvest.py
          python - <<'PY'
          from pathlib import Path
          rows = []
          for path in sorted(Path("catalog").glob("*.tsv")):
              for raw in path.read_text(encoding="utf-8").splitlines():
                  if raw.strip():
                      fields = raw.split("\t")
                      assert len(fields) == 5, (path, raw)
                      rows.append(fields)
          assert len(rows) == 300, len(rows)
          assert [int(row[0]) for row in rows] == list(range(1, 301))
          print("Validated CLIP V2 engine and 300-entry catalog")
          PY

      - name: Harvest and visually judge batch ${{ matrix.batch }}
        id: harvest
        continue-on-error: true
        env:
          PRIORITY_START: ${{ matrix.start }}
          PRIORITY_END: ${{ matrix.end }}
          TARGET_IMAGES: "30"
          MAX_WORKERS: "3"
          TORCH_THREADS: "2"
          CLIP_MODEL_ID: "openai/clip-vit-base-patch32"
          HARVEST_BUDGET_SECONDS: "6300"
          ENTRY_BUDGET_SECONDS: "90"
          MAX_SIDE: "3200"
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -o pipefail
          python harvest.py 2>&1 | tee "harvest-clip-${{ matrix.batch }}.log"

      - name: Show CLIP batch summary
        if: always()
        run: |
          echo "Harvest outcome: ${{ steps.harvest.outcome }}"
          cat iconic-environments-300/README.txt 2>/dev/null || true
          sed -n '1,100p' iconic-environments-300/failures.csv 2>/dev/null || true

      - name: Upload CLIP batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-environment-batch-${{ matrix.batch }}
          path: |
            environment-harvest/iconic-environments-300/
            environment-harvest/iconic-environments-300.zip
            environment-harvest/harvest-clip-${{ matrix.batch }}.log
            environment-harvest/harvest.py
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  merge:
    name: Merge and audit CLIP V2 environment bank
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out CLIP execution branch
        uses: actions/checkout@v4
        with:
          ref: environment-harvest-clip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install merge dependencies
        run: python -m pip install --disable-pip-version-check Pillow ImageHash
      - name: Download all CLIP batches
        uses: actions/download-artifact@v4
        with:
          pattern: clip-environment-batch-*
          path: environment-harvest/downloaded-batches
      - name: Merge images and build global audit
        working-directory: environment-harvest
        run: python merge_batches.py
      - name: Upload final CLIP environment bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iconic-environments-300-clip
          path: |
            environment-harvest/iconic-environments-300.zip
            environment-harvest/iconic-environments-300/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Publish final CLIP status
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin environment-harvest-clip
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary_path = Path("environment-harvest/iconic-environments-300/final-summary.json")
          summary = json.loads(summary_path.read_text()) if summary_path.exists() else {}
          payload = {
              "status": "completed",
              "workflow": "Iconic Environments Harvest 300 CLIP V2",
              "run_id": os.environ["RUN_ID"],
              "run_url": f'{os.environ["SERVER_URL"]}/{os.environ["REPOSITORY"]}/actions/runs/{os.environ["RUN_ID"]}',
              "artifact_name": "iconic-environments-300-clip",
              **summary,
          }
          Path("environment-harvest-clip-status.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git add environment-harvest-clip-status.json
          git commit -m "Record completed CLIP V2 harvest ${RUN_ID}" || true
          git push origin HEAD:environment-harvest-clip
