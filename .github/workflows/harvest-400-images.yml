name: Harvest 400 visual references

on:
  push:
    branches:
      - assets/400-luxury-3d-harvest
    paths:
      - tools/harvest_commons_400.py
      - .github/workflows/harvest-400-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-harvest-400
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out harvest branch
        uses: actions/checkout@v4
        with:
          ref: assets/400-luxury-3d-harvest
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image tooling
        run: python -m pip install --upgrade requests Pillow ImageHash

      - name: Harvest and validate exactly 400 images
        run: python tools/harvest_commons_400.py

      - name: Verify collection counts
        shell: bash
        run: |
          test "$(find visual-harvest-400/luxury_motivation -type f -name '*.jpg' | wc -l)" -eq 200
          test "$(find visual-harvest-400/stylized_3d -type f -name '*.jpg' | wc -l)" -eq 200
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('visual-harvest-400/summary.json').read_text())
          assert s['total'] == 400
          assert s['luxury_motivation'] == 200
          assert s['stylized_3d'] == 200
          assert s['unique_sha256'] == 400
          print(s)
          PY

      - name: Commit harvested dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-harvest-400
          git commit -m "Add 400 curated luxury and 3D visual references"
          git push origin HEAD:assets/400-luxury-3d-harvest
