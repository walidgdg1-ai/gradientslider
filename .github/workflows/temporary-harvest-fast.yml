name: Temporary fast visual harvest

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-harvest-fast.yml

permissions:
  contents: write

concurrency:
  group: temporary-fast-visual-harvest
  cancel-in-progress: true

jobs:
  harvest-final:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out harvest branch
        uses: actions/checkout@v4
        with:
          ref: assets/400-luxury-3d-fast
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --upgrade requests Pillow

      - name: Harvest final 400 images
        run: python tools/harvest_final_400.py

      - name: Verify exactly 200 plus 200 unique images
        run: |
          test "$(find visual-harvest-400/luxury_motivation -type f -name '*.jpg' | wc -l)" -eq 200
          test "$(find visual-harvest-400/stylized_3d -type f -name '*.jpg' | wc -l)" -eq 200
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('visual-harvest-400/summary.json').read_text())
          assert s['total']==400, s
          assert s['luxury_motivation']==200, s
          assert s['stylized_3d']==200, s
          assert s['unique_sha256']==400, s
          print(s)
          PY

      - name: Commit verified dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-harvest-400
          git commit -m "Add verified 400-image luxury and 3D reference dataset"
          git push origin HEAD:assets/400-luxury-3d-fast
