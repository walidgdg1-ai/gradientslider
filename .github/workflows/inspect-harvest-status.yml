name: Inspect visual harvest status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-harvest-status.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture latest workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --limit 25 --json databaseId,workflowName,status,conclusion,headSha,createdAt,updatedAt,url,event,displayTitle > harvest-run-status.json
          cat harvest-run-status.json
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest-run-status.json
          git commit -m "Refresh final harvest status snapshot" || true
          git push origin HEAD:main
