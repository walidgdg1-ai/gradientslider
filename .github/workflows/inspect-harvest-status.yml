name: Inspect visual harvest status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-harvest-status.yml

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture recent workflow runs and fast failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 25 \
            --json databaseId,workflowName,status,conclusion,headSha,createdAt,updatedAt,url,event,displayTitle \
            > harvest-run-status.json
          gh run view 30142311586 --repo "$GITHUB_REPOSITORY" --log-failed > fast-harvest-failure.log 2>&1 || true
          tail -n 120 fast-harvest-failure.log

      - name: Commit status snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest-run-status.json fast-harvest-failure.log
          git commit -m "Record visual harvest status and failure log"
          git push origin HEAD:main
