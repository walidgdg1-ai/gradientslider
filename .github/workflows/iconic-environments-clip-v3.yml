# Registered workflow retrigger
name: Iconic Environments Harvest 300 CLIP V3

on:
  push:
    branches:
      - environment-harvest-clip-v3
    paths:
      - ".github/workflows/iconic-environments-clip-v3.yml"
  workflow_dispatch:

concurrency:
  group: iconic-environments-clip-refs/heads/environment-harvest-clip
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harvest:
    name: CLIP V3 environments ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { batch: "01", start: 1, end: 30 }
          - { batch: "02", start: 31, end: 60 }
          - { batch: "03", start: 61, end: 90 }
          - { batch: "04", start: 91, end: 120 }
          - { batch: "05", start: 121, end: 150 }
          - { batch: "06", start: 151, end: 180 }
          - { batch: "07", start: 181, end: 210 }
          - { batch: "08", start: 211, end: 240 }
          - { batch: "09", start: 241, end: 270 }
          - { batch: "10", start: 271, end: 300 }
    defaults:
      run:
        working-directory: environment-harvest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: environment-harvest-clip-v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment-harvest/requirements.txt
      - name: Restore CLIP model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: clip-vit-b32-${{ runner.os }}-${{ hashFiles('environment-harvest/requirements.txt') }}
      - name: Install CPU Torch and dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Assemble and compile CLIP V3 engine
        run: |
          python - <<'PY'
          from pathlib import Path
          base = "".join(
              Path(f"parts/harvest_{name}.py.part").read_text(encoding="utf-8")
              for name in ["00", "01", "02", "03", "04"]
          )
          marker = 'if __name__ == "__main__":\n    main()'
          head, separator, tail = base.rpartition(marker)
          assert separator and not tail.strip()
          clip = Path("parts/harvest_03a_clip.py.part").read_text(encoding="utf-8")
          Path("harvest.py").write_text(
              head.rstrip() + "\n\n" + clip.strip() + "\n\n" + marker + "\n",
              encoding="utf-8",
          )
          PY
          python -m py_compile harvest.py
          python - <<'PY'
          from pathlib import Path
          rows = [
              raw.split("\t")
              for path in sorted(Path("catalog").glob("*.tsv"))
              for raw in path.read_text(encoding="utf-8").splitlines()
              if raw.strip()
          ]
          assert len(rows) == 300
          assert all(len(row) == 5 for row in rows)
          assert [int(row[0]) for row in rows] == list(range(1, 301))
          print("Validated CLIP V3 engine and 300-entry catalog")
          PY
      - name: Harvest and visually judge batch ${{ matrix.batch }}
        id: harvest
        continue-on-error: true
        env:
          PRIORITY_START: ${{ matrix.start }}
          PRIORITY_END: ${{ matrix.end }}
          TARGET_IMAGES: "30"
          MAX_WORKERS: "4"
          TORCH_THREADS: "2"
          CLIP_MODEL_ID: "openai/clip-vit-base-patch32"
          HARVEST_BUDGET_SECONDS: "4500"
          ENTRY_BUDGET_SECONDS: "60"
          MAX_SIDE: "3200"
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          set -o pipefail
          python harvest.py 2>&1 | tee "harvest-clip-v3-${{ matrix.batch }}.log"
      - name: Show batch summary
        if: always()
        run: |
          echo "Harvest outcome: ${{ steps.harvest.outcome }}"
          cat iconic-environments-300/README.txt 2>/dev/null || true
          sed -n '1,100p' iconic-environments-300/failures.csv 2>/dev/null || true
      - name: Upload CLIP V3 batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-v3-environment-batch-${{ matrix.batch }}
          path: |
            environment-harvest/iconic-environments-300/
            environment-harvest/iconic-environments-300.zip
            environment-harvest/harvest-clip-v3-${{ matrix.batch }}.log
            environment-harvest/harvest.py
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  merge:
    name: Merge and audit CLIP V3 bank
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: environment-harvest-clip-v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check Pillow ImageHash
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-v3-environment-batch-*
          path: environment-harvest/downloaded-batches
      - name: Merge and audit
        working-directory: environment-harvest
        run: python merge_batches.py
      - name: Upload final CLIP V3 bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iconic-environments-300-clip-v3
          path: |
            environment-harvest/iconic-environments-300.zip
            environment-harvest/iconic-environments-300/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
